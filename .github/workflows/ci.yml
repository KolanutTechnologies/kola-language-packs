name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: node scripts/test-utf8-roundtrip.mjs
      - name: Coverage delta vs base
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          node scripts/coverage-delta.mjs "origin/$GITHUB_BASE_REF"
      - run: git diff --exit-code README.md
      - run: git diff --exit-code .github/ISSUE_TEMPLATE/
      - run: node scripts/sync-pack-versions.mjs --check
